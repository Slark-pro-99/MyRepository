<!DOCTYPE HTML>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід у систему</title>
    <link rel="icon" type="image/png" href="Favikon.png">
    <link rel="stylesheet" href="styles_login.css">
   	<script src="script_login.js"></script>
  </head>
<body>

<div class="container">
	
    <form class="login-form" id="loginForm">
        <h2>Увійти у систему</h2>

        <div class="input-group">
            <label for="username">Ім'я користувача</label>
            <input type="username" id="UsernameInput" name="username" placeholder="Введіть ім'я користувача" required>
        </div>

        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="PasswordInput" name="password" placeholder="Введіть пароль" required>
        </div>

        <button type="submit" id="SubmitBtn">Увійти</button>
        <!--
        <p class="change-password-link">
            Забыли пароль? <a href="change_password.html">Изменить</a>
        </p>
        -->
    </form>
	</div>

</body>
</html>
